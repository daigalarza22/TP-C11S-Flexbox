<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <!--Fuente-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Flexbox</title>
</head>
<body>
    <header>
     <nav class="barra_navegacion">
         <div class="logo">
             <img src="img/VectorPizza.png" alt="logo_pizza">
             <h1>
                <span class="texto-verde">Pizza</span>
                <span class="texto-blanco">&</span>
                <span class="texto-rojo">Front</span>   
            </h1>
        </div>
         
            <ul class="contenedor-enlaces">
                <li><a href="#">Home</a></li>
                <li><a href="#">Ranking</a></li>
                <li><a href="#">Promoción</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
     </nav>

    </header>
    <main>
        <section class="contenedor-menu">
            <!--Parte izquierda-->
            <div class="menu-delivery">
                <h2>
                 <span class="texto-rojo">Envio gratis</span>    
                 <span class="texto-blanco">comprando</span>
                 <span class="texto-rojo"> 2 pizzas</span>  
                </h2>
                <img src="img/delivery.jpg" alt="delivery">
            </div>
            <!--parte derecha-->
            <div class="menu-pizzas">
               <h2 class="texto-rojo">Podio de pizzas</h2>
               <div class="menu-top5">
                 <div class="menu-lista">
                     <h3>Pizzas top 5</h3>
                     <ol>
                         <li>Muzzarella</li>
                         <li>Hawaiana</li>
                         <li>Muzzarella J&Morron</li>
                         <li>Fugazzeta</li>
                         <li>Calabresa</li>
                     </ol>
                 </div>
                 <div class="imagen-pizzas"><img src="img/PizzaFalling.jpg" alt="pizza"></div>
                 
               </div> 
            </div>
        </section>
        <footer>
            <nav class="footer_navegacion">
                <ul class="footer-enlaces">
                  <li><a href="#">Home</a></li>
                  <li><a href="#">Ranking</a></li>
                  <li><a href="#">Promoción</a></li>
                  <li><a href="#">Contacto</a></li>
               </ul>
              <div class="logo">
                  <img src="img/VectorPizza.png" alt="logo_pizza">
                  <h1>
                     <span class="texto-verde">Pizza</span>
                     <span class="texto-blanco">&</span>
                     <span class="texto-rojo">Front</span>   
                 </h1>

                </div>
            </nav>
        </footer>
    </main>
    
</body>
</html>
