<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <!--Fuente-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Flexbox</title>
</head>
<body>
    <header>
    
     <div class="logo">
         <img src="img/VectorPizza.png" alt="logo_pizza">
         <div class="titulo">
             <h1>
                 <span class="texto-verde">Pizza</span>
                 <span class="texto-blanco">&</span>
                 <span class="texto-rojo">Front</span>   
             </h1> 
         </div>
     </div>

     <div class="barra_navegacion">
         <nav class="contenedor-enlaces">
              <ul>
                 <li><a href="#">Home</a></li>
                 <li><a href="#">Ranking</a></li>
                 <li><a href="#">Promoción</a></li>
                 <li><a href="#">Contacto</a></li>
              </ul>
         </nav>
     </div>
    </header>
    <main>
        <section class="contenedor-menu">
            <!--Parte izquierda-->
            <article class="menu-delivery">
                <h2 class="titulo-delivery">
                 <span class="texto-rojo">Envio gratis</span>    
                 <span class="texto-blanco">comprando</span>
                 <span class="texto-rojo"> 2 pizzas</span>  
                </h2>
                <!--imagen delivery-->
            </article>
            <!--parte derecha-->
            <article class="menu-podio">
             <div class="titulo-podio">
                 <h2 class="texto-rojo">Podio de pizzas</h2>
             </div>
               <div class="menu-pizzas">
                  <div class="menu-top">
                     <p>Pizzas top 5</p>
                     <ol>
                         <li>Muzzarella</li>
                         <li>Hawaiana</li>
                         <li>Muzzarella J&Morron</li>
                         <li>Fugazzeta</li>
                         <li>Calabresa</li>
                     </ol>
                  </div>
                 <img src="img/PizzaFalling.jpg" alt="torre-pizza">
               </div> 
            </article>
        </section>
    </main>
     <footer>
         <div class="pie-pagina">
             <nav class="pie-enlaces">
                 <ul>
                     <li><a href="#"> Home</a></li>
                     <li><a href="#">Ranking</a></li>
                     <li><a href="#">Promoción</a></li>
                     <li><a href="#">Contacto</a></li>
                 </ul>
             </nav>
         </div>

         <div class="logo">
             <img src="img/VectorPizza.png" alt="logo">
             <div class="titulo">
                 <h2>
                     <span class="texto-verde">Pizza</span> 
                     <span class="texto-blanco">&</span> 
                     <span class="texto-rojo">Front</span> 
                 </h2>
             </div>
         </div>
    </footer>
</body>
</html>
